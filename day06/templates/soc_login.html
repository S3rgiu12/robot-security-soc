<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>SOC Analyst Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/soc-login.css') }}">
</head>
<body>
    <main class="login-card">
        <h1>🛡 Robot Security SOC</h1>
        <p class="subtitle">Secure Analyst Access</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                autocomplete="username"
                maxlength="40"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                Sign in securely
            </button>
        </form>

        <p id="message" role="alert"></p>
    </main>

    <script src="{{ url_for('static', filename='js/soc-login.js') }}" defer></script>
</body>
</html>
